<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17181C;
    --bg-panel:#1D1E22;
    --bg-raised:#26272C;
    --line:#2C2D31;
    --amber:#E8A33D;
    --amber-dim:#6B4A1F;
    --amber-wash:rgba(232,163,61,0.10);
    --text:#EDE8DD;
    --text-muted:#8B8579;
    --text-faint:#5A574E;
    --danger:#C96A4B;
  }

  *{box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    min-height:100%;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .set{
    width:100%;
    max-width:740px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.03),
      0 12px 32px rgba(0,0,0,0.45);
    overflow:hidden;
  }

  /* header */
  .set__header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
  }

  .set__brand{
    font-size:13px;
    letter-spacing:0.14em;
    font-weight:600;
    color:var(--text-muted);
  }

  .set__status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:var(--text-faint);
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--text-faint);
    flex-shrink:0;
  }

  .dot.live{
    background:var(--amber);
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,0.55); }
    50%{ box-shadow:0 0 0 5px rgba(232,163,61,0); }
  }

  hr.rule{
    border:none;
    border-top:1px solid var(--line);
    margin:0;
  }

  /* dial / hero */
  .dial{
    text-align:center;
    padding:30px 20px 24px;
  }

  .dial__freq{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:24px;
    font-weight:500;
    letter-spacing:0.01em;
    line-height:1;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  .dial__freq.live{
    color:var(--amber);
    text-shadow:0 0 18px rgba(232,163,61,0.45);
  }

  .dial__unit{
    font-size:16px;
    color:var(--text-faint);
    margin-left:6px;
    font-weight:400;
  }

  .dial__station{
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 28px;
    color:var(--text-muted);
  }

  .dial__station b{ color:var(--text); font-weight:500; }

  /* presets */
  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 20px 20px;
  }

  .preset{
    flex:1 1 calc(33% - 4px);
    min-width:120px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 12px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
    font-family:inherit;
  }

  .preset:hover{ border-color:var(--amber-dim); }

  .preset.active{
    border-color:var(--amber);
    background:var(--amber-wash);
  }

  .preset__logo{
    flex:0 0 36px;
    width:60px;
    height:60px;
    border-radius:5px;
    object-fit:cover;
    background:var(--bg);
    border:1px solid var(--line);
    opacity:.40;
    transition:opacity .2s ease;
  }

  .preset.active .preset__logo{ opacity:1; }

  .preset__body{
    min-width:0;
    flex:1 1 auto;
  }

  .preset__freq{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:14px;
    color:var(--text-muted);
    display:block;
  }

  .preset.active .preset__freq{ color:var(--amber); }

  .preset__name{
    font-size:14px;
    font-weight:500;
    display:block;
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .preset--add{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:14px;
    background:transparent;
    border-style:dashed;
  }

  .preset--add:hover{ color:var(--text); border-color:var(--amber-dim); }

  .preset__remove{
    float:right;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:0 0 0 8px;
  }

  .preset__remove:hover{ color:var(--danger); }

  /* add form */
  .addform{
    margin:0 20px 20px;
    padding:14px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:5px;
  }

  .addform label{
    display:block;
    font-size:12px;
    color:var(--text-muted);
    margin:10px 0 4px;
  }

  .addform label:first-child{ margin-top:0; }

  .addform input{
    width:100%;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 10px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
  }

  .addform input:focus{
    outline:none;
    border-color:var(--amber-dim);
  }

  .addform__actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }

  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    padding:9px 14px;
    border-radius:4px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-deep);
    color:var(--text);
  }

  .btn:focus-visible, .preset:focus-visible, .transport__play:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .btn--primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#1B1300;
  }

  /* transport */
  .transport{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
  }

  .transport__play{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--amber);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .transport__play svg{ fill:#1B1300; }

  .transport__vol{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
  }

  .transport__vol svg{ fill:var(--text-faint); flex-shrink:0; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:3px;
    background:var(--line);
    border-radius:2px;
  }

  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }

  input[type="range"]::-moz-range-thumb{
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--amber);
    border:none;
    cursor:pointer;
  }

  .status-line{
    padding:0 20px 14px;
    font-size:13px;
    color:var(--danger);
    min-height:0;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .status-line .btn{
    font-size:12px;
    padding:5px 10px;
    color:var(--text);
    border-color:var(--danger);
    flex-shrink:0;
  }

  .status-line .btn:hover{ background:var(--bg-raised); }

  .set__footer{
    padding:12px 20px 16px;
    font-size:12px;
    color:var(--text-faint);
    line-height:1.5;
  }

  .set__footer button{
    background:none;
    border:none;
    color:var(--text-faint);
    text-decoration:underline;
    cursor:pointer;
    font-size:12px;
    padding:0;
    font-family:inherit;
  }

  .set__footer button:hover{ color:var(--text-muted); }

  .hidden{ display:none; }
</style>
</head>
<body>

<div class="set">

  <div class="set__header">
    <div class="set__brand">RADIO PLAYER</div>
    <div class="set__status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Apagada</span>
    </div>
  </div>

  <hr class="rule">

  <div class="dial">
    <div class="dial__station" id="dialStation">Elige una emisora</div>
    <div>
      <span class="dial__freq" id="dialFreq">&mdash;</span>
      <span class="dial__unit" id="dialUnit"></span>
    </div>
  </div>

  <div class="presets" id="presets"></div>

  <div class="addform hidden" id="addForm">
    <label for="fName">Nombre</label>
    <input type="text" id="fName" placeholder="p. ej. Radio 3">
    <label for="fUrl">URL del stream</label>
    <input type="text" id="fUrl" placeholder="https://...">
    <label for="fFreq">Frecuencia (opcional)</label>
    <input type="text" id="fFreq" placeholder="p. ej. 93.2">
    <div class="addform__actions">
      <button class="btn btn--primary" id="saveStation">Guardar</button>
      <button class="btn" id="cancelStation">Cancelar</button>
    </div>
  </div>

  <div class="transport">
    <button class="transport__play" id="playBtn" aria-label="Reproducir">
      <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l10-5.5z"/></svg>
      <svg id="pauseIcon" width="16" height="16" viewBox="0 0 16 16" class="hidden"><rect x="3" y="2.5" width="3.5" height="11"/><rect x="9.5" y="2.5" width="3.5" height="11"/></svg>
    </button>
    <div class="transport__vol">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 6v4h3l4 3V3L5 6H2z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85">
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="set__footer">
    <button id="resetStations">Borrar mis emisoras guardadas</button>
  </div>

</div>

<audio id="player" referrerpolicy="no-referrer"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function(){
  const DEFAULT_STATIONS = [
    { id:'cope', name:'COPE', freq:'100.7', url:'https://flucast05-o-cloud.flumotion.com/cope/net2.mp3', logo:'https://static.mytuner.mobi/media/radios-150px/556/cadena-cope.fb1248fc.png', builtin:true },
    { id:'ondacero', name:'Onda Cero', freq:'98.0', url:'https://27833.live.streamtheworld.com/OCAAC/HLS/playlist.m3u8', logo:'https://static.mytuner.mobi/media/radios-150px/168/onda-cero-madrid.eb6cebfc.png', builtin:true },
    { id:'esradio', name:'esRadio', freq:'99.1', url:'https://libertaddigital-radio-live1.flumotion.com/libertaddigital/ld-live1-low.mp3', logo:'https://static.mytuner.mobi/media/radios-150px/592/esradio.fab2c4b6.jpg', builtin:true },
    { id:'cadenaser', name:'Cadena SER', freq:'105.4', url:'https://27833.live.streamtheworld.com/CADENASERAAC_RW/HLS/playlist.m3u8', logo:'https://static.mytuner.mobi/media/radios-150px/034/cadena-ser.00ffdc72.png', builtin:true },
    { id:'radiomarca', name:'Radio Marca', freq:'103.5', url:'https://25453.live.streamtheworld.com/RADIOMARCA_NACIONAL_SC', logo:'https://static.mytuner.mobi/media/radios-150px/076/radio-marca.04f5691c.png', builtin:true },
    { id:'smoothjazz', name:'Smooth-Jazz Radio', freq:'00.0', url:'https://jking.cdnstream1.com/b22139_128mp3', logo:'https://www.smoothjazz.com/sites/default/files/theme/sj-circle-logo.png', builtin:true }
  ];
  const player = document.getElementById('player');
  const presetsEl = document.getElementById('presets');
  const dialFreq = document.getElementById('dialFreq');
  const dialUnit = document.getElementById('dialUnit');
  const dialStation = document.getElementById('dialStation');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const statusLine = document.getElementById('statusLine');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const volume = document.getElementById('volume');
  const addForm = document.getElementById('addForm');
  const fName = document.getElementById('fName');
  const fUrl = document.getElementById('fUrl');
  const fFreq = document.getElementById('fFreq');

  let stations = DEFAULT_STATIONS.slice();
  let currentId = null;
  let hls = null;

  function isHlsUrl(url){
    return /\.m3u8($|\?)/i.test(url);
  }

  function teardownHls(){
    if(hls){
      hls.destroy();
      hls = null;
    }
  }

  function loadIntoPlayer(url, onFailure){
    teardownHls();

    if(isHlsUrl(url) && window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.on(Hls.Events.ERROR, (event, data) => {
        if(data.fatal) onFailure();
      });
      hls.loadSource(url);
      hls.attachMedia(player);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        player.play().catch(onFailure);
      });
      return;
    }

    // Native playback: works for direct mp3/aac streams, and for HLS
    // on browsers with built-in support (Safari).
    player.src = url;
    player.play().catch(onFailure);
  }

  player.volume = parseFloat(volume.value);

  async function loadCustomStations(){
    try{
      const res = await window.storage.get('custom-stations', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(Array.isArray(parsed)) stations = DEFAULT_STATIONS.concat(parsed);
      }
    }catch(e){
      // no custom stations saved yet, or storage unavailable — that's fine
    }
    renderPresets();
  }

  async function saveCustomStations(){
    const custom = stations.filter(s => !s.builtin);
    try{
      await window.storage.set('custom-stations', JSON.stringify(custom), false);
    }catch(e){
      console.error('No se pudieron guardar las emisoras', e);
    }
  }

  function renderPresets(){
    presetsEl.innerHTML = '';
    stations.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'preset' + (s.id === currentId ? ' active' : '');
      btn.innerHTML =
        '<img class="preset__logo" src="' + (s.logo || '') + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
        '<span class="preset__body">' +
        '<span class="preset__freq">' + (s.freq ? s.freq + ' MHz' : '&nbsp;') +
        (!s.builtin ? '<span class="preset__remove" data-id="'+s.id+'">&times;</span>' : '') +
        '</span><span class="preset__name">' + escapeHtml(s.name) + '</span>' +
        '</span>';
      btn.addEventListener('click', (e) => {
        if(e.target.classList.contains('preset__remove')){
          e.stopPropagation();
          removeStation(s.id);
          return;
        }
        playStation(s.id);
      });
      presetsEl.appendChild(btn);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'preset preset--add';
    addBtn.textContent = '+ Añadir emisora';
    addBtn.addEventListener('click', () => addForm.classList.toggle('hidden'));
    presetsEl.appendChild(addBtn);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function removeStation(id){
    stations = stations.filter(s => s.id !== id);
    if(currentId === id){
      teardownHls();
      player.pause();
      player.removeAttribute('src');
      currentId = null;
      updateDial(null);
      setLive(false);
    }
    saveCustomStations();
    renderPresets();
  }

  function clearError(){
    statusLine.innerHTML = '';
  }

  function showError(message, fallbackUrl){
    statusLine.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = message;
    statusLine.appendChild(span);
    if(fallbackUrl){
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Abrir en pestaña nueva';
      btn.addEventListener('click', () => window.open(fallbackUrl, '_blank', 'noopener'));
      statusLine.appendChild(btn);
    }
  }

  function playStation(id){
    const s = stations.find(st => st.id === id);
    if(!s) return;
    clearError();
    currentId = id;
    loadIntoPlayer(s.url, () => {
      setLive(false);
      showError('No se pudo reproducir aquí.', s.url);
    });
    updateDial(s);
    renderPresets();
  }

  function updateDial(s){
    if(!s){
      dialFreq.textContent = '—';
      dialUnit.textContent = '';
      dialStation.textContent = 'Elige una emisora';
      return;
    }
    dialFreq.textContent = s.freq || '•';
    dialUnit.textContent = s.freq ? 'MHz' : '';
    dialStation.innerHTML = '<b>' + escapeHtml(s.name) + '</b>';
  }

  function setLive(isLive){
    statusDot.classList.toggle('live', isLive);
    statusText.textContent = isLive ? 'en directo' : 'apagada';
    dialFreq.classList.toggle('live', isLive);
    playIcon.classList.toggle('hidden', isLive);
    pauseIcon.classList.toggle('hidden', !isLive);
    playBtn.setAttribute('aria-label', isLive ? 'Pausar' : 'Reproducir');
  }

  player.addEventListener('playing', () => setLive(true));
  player.addEventListener('pause', () => setLive(false));
  player.addEventListener('ended', () => setLive(false));
  player.addEventListener('error', () => {
    setLive(false);
    const s = stations.find(st => st.id === currentId);
    showError(
      'No se pudo cargar el audio aquí (puede que el servidor bloquee la reproducción incrustada).',
      s ? s.url : null
    );
  });

  playBtn.addEventListener('click', () => {
    if(!currentId){
      if(stations.length) playStation(stations[0].id);
      return;
    }
    if(player.paused){
      player.play().catch(() => {
        const s = stations.find(st => st.id === currentId);
        showError('No se pudo reproducir aquí.', s ? s.url : null);
      });
    }else{
      player.pause();
    }
  });

  volume.addEventListener('input', () => { player.volume = parseFloat(volume.value); });

  document.getElementById('saveStation').addEventListener('click', () => {
    const name = fName.value.trim();
    const url = fUrl.value.trim();
    const freq = fFreq.value.trim();
    if(!name || !url){
      statusLine.textContent = 'Ponle un nombre y una URL a la emisora.';
      return;
    }
    const id = 'custom-' + Date.now();
    stations.push({ id, name, url, freq, builtin:false });
    fName.value = ''; fUrl.value = ''; fFreq.value = '';
    addForm.classList.add('hidden');
    statusLine.textContent = '';
    saveCustomStations();
    renderPresets();
  });

  document.getElementById('cancelStation').addEventListener('click', () => {
    fName.value = ''; fUrl.value = ''; fFreq.value = '';
    addForm.classList.add('hidden');
  });

  document.getElementById('resetStations').addEventListener('click', async () => {
    stations = DEFAULT_STATIONS.slice();
    if(currentId && !DEFAULT_STATIONS.find(s => s.id === currentId)){
      teardownHls();
      player.pause();
      player.removeAttribute('src');
      currentId = null;
      updateDial(null);
      setLive(false);
    }
    try{ await window.storage.delete('custom-stations', false); }catch(e){}
    renderPresets();
  });

  loadCustomStations();
})();
</script>

</body>
</html>
